<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ganesh Chaturthi Celebration | ॥ श्री गणेशाय नमः ॥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Yatra+One&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #120309;
      font-family: 'Outfit', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1280px;
      max-height: 720px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 180, 50, 0.2);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at center, #451022 0%, #280714 55%, #14040a 100%);
    }
    .ui-controls {
      position: absolute;
      bottom: 16px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    .btn {
      background: rgba(45, 12, 22, 0.75);
      border: 1px solid #ffd700;
      color: #ffe57f;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .btn:hover {
      background: #ffd700;
      color: #2a0510;
      box-shadow: 0 0 14px rgba(255, 215, 0, 0.6);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(1px);
    }
    #progress-tag {
      position: absolute;
      bottom: 18px;
      left: 20px;
      color: #ffca28;
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="animationCanvas" width="1280" height="720"></canvas>
    
    <div id="progress-tag">Sketching Lord Ganesha: 0%</div>

    <div class="ui-controls">
      <button class="btn" id="btn-resketch">↺ Re-sketch</button>
      <button class="btn" id="btn-pause">⏸ Pause</button>
      <button class="btn" id="btn-fullscreen">⛶ Fullscreen</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('animationCanvas');
    const ctx = canvas.getContext('2d');
    const progressTag = document.getElementById('progress-tag');
    const btnResketch = document.getElementById('btn-resketch');
    const btnPause = document.getElementById('btn-pause');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    const W = 1280;
    const H = 720;
    const CX = W / 2;
    const CY = H * 0.535;

    let isPaused = false;
    let timeSec = 0;
    let strokes = [];
    let totalPoints = 0;
    let pointsDrawn = 0;
    let currentStrokeIdx = 0;
    let currentPtIdx = 0;
    let isCompleted = false;
    let colorBloomAlpha = 0;
    let brushPos = { x: CX, y: CY };
    let brushSparks = [];

    // Persistent offscreen canvas for sketch lines
    const sketchCanvas = document.createElement('canvas');
    sketchCanvas.width = W;
    sketchCanvas.height = H;
    const sCtx = sketchCanvas.getContext('2d');

    // Bloom image
    const bloomImg = new Image();
    bloomImg.src = 'assets/ganesh.png';
    let bloomLoaded = false;
    bloomImg.onload = () => { bloomLoaded = true; };

    // --- 1. PARTICLES & DIYAS SETUP ---
    class FallingPetal {
      constructor(startAnywhere = false) {
        this.reset(startAnywhere);
      }
      reset(startAnywhere = false) {
        this.xBase = Math.random() * (W + 40) - 20;
        this.y = startAnywhere ? Math.random() * H : Math.random() * -60 - 20;
        this.speedY = 1.2 + Math.random() * 1.4;
        this.swayAmp = 25 + Math.random() * 30;
        this.swaySpeed = 1.0 + Math.random() * 1.2;
        this.swayPhase = Math.random() * Math.PI * 2;
        this.angle = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.04;
        this.flipAngle = Math.random() * Math.PI * 2;
        this.flipSpeed = 1.5 + Math.random() * 1.8;
        this.size = 11 + Math.random() * 7;
        this.isMarigold = Math.random() < 0.65;
        this.colorDark = this.isMarigold ? '#ff8f00' : '#c2185b';
        this.colorLight = this.isMarigold ? '#ffd54f' : '#ff4081';
      }
      update(dt) {
        this.y += this.speedY * (dt * 60);
        this.flipAngle += this.flipSpeed * dt;
        this.angle += this.rotSpeed * (dt * 60);
        if (this.y > H + 40) this.reset(false);
      }
      draw(c, t) {
        const sway = Math.sin(t * this.swaySpeed + this.swayPhase) * this.swayAmp;
        const curX = this.xBase + sway;
        const flip = Math.abs(Math.cos(this.flipAngle));
        const w = Math.max(3, this.size * (0.3 + 0.7 * flip));
        const h = Math.max(4, this.size * 1.4);

        c.save();
        c.translate(curX, this.y);
        c.rotate(this.angle);

        c.fillStyle = this.colorDark;
        c.beginPath();
        c.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = this.colorLight;
        c.beginPath();
        c.ellipse(0, 0, w * 0.35, h * 0.35, 0, 0, Math.PI * 2);
        c.fill();

        c.restore();
      }
    }

    class Sparkle {
      constructor() { this.reset(); }
      reset() {
        this.x = W * 0.2 + Math.random() * W * 0.6;
        this.y = H * 0.2 + Math.random() * H * 0.7;
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = -0.3 - Math.random() * 0.5;
        this.radius = 1.8 + Math.random() * 2.2;
        this.pulseFreq = 2.0 + Math.random() * 2.0;
        this.phase = Math.random() * Math.PI * 2;
        this.life = 3 + Math.random() * 4;
        this.age = Math.random() * this.life;
      }
      update(dt) {
        this.x += this.vx * (dt * 60);
        this.y += this.vy * (dt * 60);
        this.age += dt;
        if (this.age >= this.life || this.y < -10) this.reset();
      }
      draw(c, t) {
        const pulse = 0.5 + 0.5 * Math.sin(t * this.pulseFreq + this.phase);
        const r = this.radius * (0.8 + 0.4 * pulse);
        c.save();
        c.globalAlpha = pulse * 0.85;
        c.fillStyle = '#ffe082';
        c.beginPath();
        c.arc(this.x, this.y, r, 0, Math.PI * 2);
        c.fill();

        c.strokeStyle = '#fff9c4';
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(this.x - r * 2.2, this.y);
        c.lineTo(this.x + r * 2.2, this.y);
        c.moveTo(this.x, this.y - r * 2.2);
        c.lineTo(this.x, this.y + r * 2.2);
        c.stroke();
        c.restore();
      }
    }

    class Diya {
      constructor(x, y, scale = 1.0) {
        this.x = x;
        this.y = y;
        this.scale = scale;
        this.phase = Math.random() * Math.PI * 2;
      }
      update(dt) {
        this.phase += 11.0 * dt;
      }
      draw(c, t) {
        const bx = this.x, by = this.y, sc = this.scale;
        const jitter = Math.sin(this.phase) * 0.12 + Math.cos(this.phase * 2.3) * 0.08;

        // Floor warm illumination
        c.save();
        const rad = 120 * sc * (1.0 + jitter);
        const grad = c.createRadialGradient(bx, by - 5, 5, bx, by - 5, rad);
        grad.addColorStop(0, 'rgba(255, 180, 50, 0.4)');
        grad.addColorStop(0.5, 'rgba(255, 120, 20, 0.15)');
        grad.addColorStop(1, 'rgba(255, 100, 0, 0)');
        c.fillStyle = grad;
        c.beginPath();
        c.arc(bx, by - 5, rad, 0, Math.PI * 2);
        c.fill();
        c.restore();

        // Brass bowl
        c.fillStyle = '#8d4d12';
        c.beginPath();
        c.ellipse(bx, by + 12 * sc, 24 * sc, 6 * sc, 0, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = '#b86e16';
        c.beginPath();
        c.moveTo(bx - 40 * sc, by);
        c.lineTo(bx - 28 * sc, by + 14 * sc);
        c.lineTo(bx + 28 * sc, by + 14 * sc);
        c.lineTo(bx + 40 * sc, by);
        c.closePath();
        c.fill();

        c.fillStyle = '#f5b041';
        c.beginPath();
        c.ellipse(bx, by - 2 * sc, 38 * sc, 7 * sc, 0, 0, Math.PI * 2);
        c.fill();

        // Flickering Flame
        const curH = 38 * sc * (1.0 + jitter * 0.85);
        const tipSway = Math.sin(t * 8.0 + this.phase) * 3.5 * sc;
        const tipX = bx + tipSway;
        const tipY = by - 3 * sc - curH;

        // Outer flame
        c.fillStyle = '#ff5722';
        c.beginPath();
        c.moveTo(bx - 14 * sc, by - 2 * sc);
        c.quadraticCurveTo(bx - 16 * sc, by - curH * 0.4, tipX, tipY);
        c.quadraticCurveTo(bx + 16 * sc, by - curH * 0.4, bx + 14 * sc, by - 2 * sc);
        c.fill();

        // Inner golden flame
        c.fillStyle = '#ffeb3b';
        c.beginPath();
        c.moveTo(bx - 9 * sc, by - 2 * sc);
        c.quadraticCurveTo(bx - 10 * sc, by - curH * 0.35, tipX * 0.7 + bx * 0.3, tipY + curH * 0.28);
        c.quadraticCurveTo(bx + 10 * sc, by - curH * 0.35, bx + 9 * sc, by - 2 * sc);
        c.fill();

        // Core
        c.fillStyle = '#ffffff';
        c.beginPath();
        c.moveTo(bx - 4 * sc, by - 2 * sc);
        c.quadraticCurveTo(bx - 5 * sc, by - curH * 0.2, bx, tipY + curH * 0.55);
        c.quadraticCurveTo(bx + 5 * sc, by - curH * 0.2, bx + 4 * sc, by - 2 * sc);
        c.fill();
      }
    }

    const petals = Array.from({ length: 45 }, () => new FallingPetal(true));
    const sparkles = Array.from({ length: 60 }, () => new Sparkle());
    const diyas = [
      new Diya(140, 642, 1.15),
      new Diya(310, 658, 0.85),
      new Diya(W - 310, 658, 0.85),
      new Diya(W - 140, 642, 1.15)
    ];

    // --- 2. LOAD SKETCH DATA ---
    async function loadStrokes() {
      try {
        const res = await fetch('assets/ganesh_sketch.json');
        const data = await res.json();
        const cachedSize = data.size || 490;
        const targetSize = 490;
        const scale = targetSize / cachedSize;
        const ox = CX - targetSize / 2;
        const oy = CY - targetSize / 2;

        strokes = data.strokes.map(s => ({
          color: `rgb(${s.color[0]}, ${s.color[1]}, ${s.color[2]})`,
          pts: s.pts.map(p => ({ x: ox + p[0] * scale, y: oy + p[1] * scale }))
        }));
        totalPoints = strokes.reduce((sum, s) => sum + s.pts.length, 0);
      } catch (err) {
        console.warn('Could not load assets/ganesh_sketch.json:', err);
      }
    }
    loadStrokes();

    function resetSketch() {
      sCtx.clearRect(0, 0, W, H);
      currentStrokeIdx = 0;
      currentPtIdx = 0;
      pointsDrawn = 0;
      isCompleted = false;
      colorBloomAlpha = 0;
      brushSparks = [];
    }

    function skipSketch() {
      if (isCompleted) return;
      for (const s of strokes) {
        sCtx.strokeStyle = s.color;
        sCtx.lineWidth = 2;
        sCtx.beginPath();
        s.pts.forEach((p, idx) => {
          if (idx === 0) sCtx.moveTo(p.x, p.y);
          else sCtx.lineTo(p.x, p.y);
        });
        sCtx.stroke();
      }
      currentStrokeIdx = strokes.length;
      isCompleted = true;
      colorBloomAlpha = 180;
      pointsDrawn = totalPoints;
    }

    // --- 3. MAIN ANIMATION LOOP ---
    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (!isPaused) {
        timeSec += dt;

        // Update sketch
        if (!isCompleted && strokes.length > 0) {
          let budget = 48;
          while (budget > 0 && currentStrokeIdx < strokes.length) {
            const curStroke = strokes[currentStrokeIdx];
            const pts = curStroke.pts;

            if (currentPtIdx < pts.length - 1) {
              const p0 = pts[currentPtIdx];
              const p1 = pts[currentPtIdx + 1];

              sCtx.strokeStyle = curStroke.color;
              sCtx.lineWidth = 2;
              sCtx.beginPath();
              sCtx.moveTo(p0.x, p0.y);
              sCtx.lineTo(p1.x, p1.y);
              sCtx.stroke();

              brushPos = p1;
              currentPtIdx++;
              pointsDrawn++;
              budget--;

              if (Math.random() < 0.6) {
                brushSparks.push({
                  x: p1.x, y: p1.y,
                  vx: (Math.random() - 0.5) * 3,
                  vy: (Math.random() - 0.5) * 3 - 0.5,
                  life: 0.35 + Math.random() * 0.25,
                  age: 0,
                  color: curStroke.color
                });
              }
            } else {
              currentStrokeIdx++;
              currentPtIdx = 0;
            }
          }

          if (currentStrokeIdx >= strokes.length) {
            isCompleted = true;
          }
        } else if (isCompleted && colorBloomAlpha < 180) {
          colorBloomAlpha = Math.min(180, colorBloomAlpha + 65 * dt);
        }

        // Update particles
        brushSparks.forEach(sp => {
          sp.x += sp.vx * (dt * 60);
          sp.y += sp.vy * (dt * 60);
          sp.age += dt;
        });
        brushSparks = brushSparks.filter(sp => sp.age < sp.life);

        petals.forEach(p => p.update(dt));
        sparkles.forEach(sp => sp.update(dt));
        diyas.forEach(d => d.update(dt));
      }

      // Update UI Progress
      if (!isCompleted && totalPoints > 0) {
        const pct = Math.floor((pointsDrawn / totalPoints) * 100);
        progressTag.textContent = `Sketching Lord Ganesha: ${pct}%`;
      } else {
        progressTag.textContent = `॥ ॐ गं गणपतये नमः ॥`;
      }

      // --- 4. RENDER FRAME ---
      ctx.clearRect(0, 0, W, H);

      // Rotating Mandala
      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(timeSec * 0.035);
      ctx.strokeStyle = 'rgba(255, 215, 100, 0.09)';
      ctx.lineWidth = 1;
      for (let r = 70; r <= 270; r += 50) {
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();
      }
      for (let i = 0; i < 16; i++) {
        const th = (i * Math.PI * 2) / 16;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(th) * 260, Math.sin(th) * 260);
        ctx.stroke();
      }
      ctx.restore();

      // Pulsating Divine Aura
      const pulse = 0.5 + 0.5 * Math.sin(timeSec * 1.8);
      ctx.save();
      const auraRad = 270 * (0.95 + 0.1 * pulse);
      const auraGrad = ctx.createRadialGradient(CX, CY, 30, CX, CY, auraRad);
      auraGrad.addColorStop(0, 'rgba(255, 215, 65, 0.35)');
      auraGrad.addColorStop(0.5, 'rgba(255, 160, 20, 0.18)');
      auraGrad.addColorStop(1, 'rgba(255, 140, 0, 0)');
      ctx.fillStyle = auraGrad;
      ctx.beginPath();
      ctx.arc(CX, CY, auraRad, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Sparkles (Background)
      sparkles.slice(0, 30).forEach(sp => sp.draw(ctx, timeSec));

      // Watercolor Bloom
      if (bloomLoaded && colorBloomAlpha > 0) {
        ctx.save();
        ctx.globalAlpha = colorBloomAlpha / 255;
        const bSize = 480;
        ctx.drawImage(bloomImg, CX - bSize / 2, CY - bSize / 2, bSize, bSize);
        ctx.restore();
      }

      // Sketch Canvas (with breathing pulse once completed)
      ctx.save();
      if (isCompleted) {
        const sc = 1.0 + 0.015 * pulse;
        ctx.translate(CX, CY);
        ctx.scale(sc, sc);
        ctx.translate(-CX, -CY);
      }
      ctx.drawImage(sketchCanvas, 0, 0);
      ctx.restore();

      // Magic Brush Tip & Sparks (during sketching)
      if (!isCompleted) {
        brushSparks.forEach(sp => {
          const a = 1.0 - (sp.age / sp.life);
          ctx.save();
          ctx.globalAlpha = a;
          ctx.fillStyle = sp.color;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, 2.5 * a, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        // Glowing Star Cursor
        ctx.save();
        const bx = brushPos.x, by = brushPos.y;
        const bGrad = ctx.createRadialGradient(bx, by, 1, bx, by, 16);
        bGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
        bGrad.addColorStop(0.5, 'rgba(255, 215, 65, 0.5)');
        bGrad.addColorStop(1, 'rgba(255, 200, 50, 0)');
        ctx.fillStyle = bGrad;
        ctx.beginPath();
        ctx.arc(bx, by, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#fffde7';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(bx - 10, by); ctx.lineTo(bx + 10, by);
        ctx.moveTo(bx, by - 10); ctx.lineTo(bx, by + 10);
        ctx.stroke();
        ctx.restore();
      }

      // Sparkles (Foreground)
      sparkles.slice(30).forEach(sp => sp.draw(ctx, timeSec));

      // Diyas
      diyas.forEach(d => d.draw(ctx, timeSec));

      // Top Toran & Bells
      drawToran(ctx, timeSec);

      // Top Festive Typography
      drawTypography(ctx, timeSec);

      // Falling Flower Petals
      petals.forEach(p => p.draw(ctx, timeSec));
    }

    function drawToran(c, t) {
      // Bells
      const bellPositions = [W * 0.08, W * 0.18, W * 0.82, W * 0.92];
      bellPositions.forEach((bx, idx) => {
        const sway = Math.sin(t * 1.5 + idx) * 0.06;
        const len = 75;
        const botX = bx + Math.sin(sway) * len;
        const botY = Math.cos(sway) * len;

        c.strokeStyle = '#c6841b';
        c.lineWidth = 2;
        c.beginPath();
        c.moveTo(bx, 0);
        c.lineTo(botX, botY);
        c.stroke();

        c.fillStyle = '#ffd54f';
        c.beginPath();
        c.arc(botX, botY + 12, 10, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = '#e65100';
        c.beginPath();
        c.arc(botX, botY + 16, 3, 0, Math.PI * 2);
        c.fill();
      });

      // Mango leaves swag
      const numArcs = 10;
      const arcW = W / numArcs;
      for (let i = 0; i < numArcs; i++) {
        const sx = i * arcW, ex = (i + 1) * arcW, mx = (sx + ex) / 2;
        c.fillStyle = '#2e7d32';
        c.beginPath();
        c.moveTo(sx, 0);
        c.lineTo(ex, 0);
        c.lineTo(mx, 26);
        c.closePath();
        c.fill();

        c.fillStyle = '#ff8f00';
        c.beginPath();
        c.arc(sx, 5, 8, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = '#ffd54f';
        c.beginPath();
        c.arc(sx, 5, 4, 0, Math.PI * 2);
        c.fill();
      }
    }

    function drawTypography(c, t) {
      c.save();
      c.textAlign = 'center';

      // Title Shadow
      c.font = '900 52px "Cinzel Decorative", serif';
      c.fillStyle = '#100307';
      c.fillText('Ganesh Chaturthi', CX + 2, 54);

      // Title Glow & Gold
      const glowAlpha = 0.7 + 0.3 * Math.sin(t * 2.5);
      c.shadowColor = `rgba(255, 215, 0, ${glowAlpha})`;
      c.shadowBlur = 18;
      c.fillStyle = '#fff3c4';
      c.fillText('Ganesh Chaturthi', CX, 52);
      c.shadowBlur = 0;

      // Subtitle
      c.font = '700 24px "Yatra One", cursive, sans-serif';
      c.fillStyle = '#100307';
      c.fillText('॥ ॐ गं गणपतये नमः ॥', CX + 1, 95);
      c.fillStyle = '#ffca28';
      c.fillText('॥ ॐ गं गणपतये नमः ॥', CX, 94);

      // Gold divider wings
      c.strokeStyle = '#c6841b';
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(CX - 260, 114); c.lineTo(CX - 40, 114);
      c.moveTo(CX + 40, 114); c.lineTo(CX + 260, 114);
      c.stroke();

      c.fillStyle = '#ffd54f';
      c.beginPath();
      c.arc(CX, 114, 5, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#d32f2f';
      c.beginPath();
      c.arc(CX, 114, 2.5, 0, Math.PI * 2);
      c.fill();

      c.restore();
    }

    // --- 5. EVENT LISTENERS ---
    btnResketch.addEventListener('click', resetSketch);
    btnPause.addEventListener('click', () => {
      isPaused = !isPaused;
      btnPause.textContent = isPaused ? '▶ Resume' : '⏸ Pause';
    });
    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        isPaused = !isPaused;
        btnPause.textContent = isPaused ? '▶ Resume' : '⏸ Pause';
      } else if (e.key === 'r' || e.key === 'R') {
        resetSketch();
      } else if (e.key === 's' || e.key === 'S') {
        skipSketch();
      }
    });

    requestAnimationFrame(animate);
  </script>
</body>
</html>
